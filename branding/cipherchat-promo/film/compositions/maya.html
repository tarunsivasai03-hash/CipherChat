  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const DUR = 3.95;
      const PLAIN = "Meet at 7";
      function shift(ch, k) {
        const c = ch.charCodeAt(0);
        if (c >= 65 && c <= 90) return String.fromCharCode(((c - 65 + k) % 26 + 26) % 26 + 65);
        if (c >= 97 && c <= 122) return String.fromCharCode(((c - 97 + k) % 26 + 26) % 26 + 97);
        return ch;
      }
      // Caesar +3, one letter at a time: each letter steps through its three real shifts.
      function rolled(t) {
        let out = "";
        for (let i = 0; i < PLAIN.length; i++) {
          const local = (t - 1.0 - i * 0.07) / 0.09;
          out += shift(PLAIN[i], Math.max(0, Math.min(3, Math.floor(local))));
        }
        return out;
      }
      const flyText = document.getElementById("m-flytext");
      const status = document.getElementById("m-st");
      function render(t) {
        flyText.textContent = t < 1.0 ? PLAIN : rolled(t);
        flyText.style.fontFamily = t < 1.0 ? '"AppSerif", Georgia, serif' : '"JetBrains Mono", monospace';
        status.textContent = t < 2.35 ? "Sending…" : t < 2.95 ? "Sent" : "Delivered";
      }
      const proxy = { t: 0 };
      tl.to(proxy, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(proxy.t) }, 0);

      // Ground drift (slow, constant).
      tl.fromTo("#m-b1", { x: 0, y: 0 }, { x: 120, y: 60, duration: DUR, ease: "none" }, 0);
      tl.fromTo("#m-b2", { x: 0, y: 0 }, { x: -90, y: -40, duration: DUR, ease: "none" }, 0);

      // Title: per word, blur to sharp, no translate. Lands and holds; exits with the whip.

      // Finger comes in from the lower right and taps send.

      tl.to("#m-finger", { scale: 0.86, duration: 0.08, ease: "power2.in" }, 0.78);
      tl.to("#m-send", { scale: 0.9, duration: 0.08, ease: "power2.in" }, 0.78);
      tl.to("#m-finger", { scale: 1, duration: 0.12, ease: "power2.out" }, 0.88);
      tl.to("#m-send", { scale: 1, duration: 0.14, ease: "back.out(1.4)" }, 0.88);
      tl.to("#m-finger", { x: 1020, y: 1760, opacity: 0, duration: 0.35, ease: "power3.in" }, 1.05);

      // The text leaves the composer and flies up into the new bubble while it shifts into code.
      tl.set("#m-text", { opacity: 0 }, 0.95);
      tl.fromTo("#m-placeholder", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.05);
      tl.fromTo("#m-fly", { x: -440, y: 456, scale: 1.0 }, { x: 0, y: 0, scale: 1, duration: 0.8, ease: "expo.out" }, 0.95);
      tl.fromTo("#m-flybg", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 1.25);
      tl.fromTo("#m-flychip, #m-flytime", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.6);
      tl.fromTo("#m-list", { y: 0 }, { y: -230, duration: 0.55, ease: "power2.inOut" }, 0.95);
      tl.fromTo("#m-st", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 1.78);

      // Camera leans toward the delivered bubble, then whips left into Sam's phone.
      tl.fromTo("#m-world", { scale: 1, x: 0, filter: "blur(0px)" }, { scale: 1.08, duration: 1.0, ease: "power2.inOut", transformOrigin: "760px 760px" }, 2.55);
      tl.to("#m-title", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 2.45);
      tl.to("#m-world", { x: -1080, filter: "blur(18px)", duration: 0.35, ease: "power3.inOut" }, 3.6);

      // Older items slide under the header as the list scrolls; fade them so nothing shows through.
      tl.fromTo("#m-day, #m-in1", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, 0.95);
      tl.fromTo("#m-del1", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in" }, 0.95);
      render(0);
      window.__timelines["maya"] = tl;
    })();
