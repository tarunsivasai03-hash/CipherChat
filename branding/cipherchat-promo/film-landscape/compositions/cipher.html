    (function () {
      const tl = gsap.timeline({ paused: true });
      const DUR = 4.85;

      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const LETTERS = "abcdefghijklmnopqrstuvwxyz";
      const ANIMALS = Array.from("🐖🐨🐷🐤🐇🐙🐢🐝🦊🐸🐳🦉");

      // Scramble into `target`, left to right, from `from` (seconds). Each glyph flickers through seeded letters, then settles.
      function scramble(target, from, t, seed, pool) {
        const chars = Array.from(target);
        let out = "";
        for (let i = 0; i < chars.length; i++) {
          const ch = chars[i];
          const local = t - from - i * 0.03;
          // Spaces and digits pass through these ciphers unchanged, so they never flicker.
          if (ch === " " || (!pool && ch >= "0" && ch <= "9")) { out += local < 0 ? " " : ch; continue; }
          if (local < 0) { out += pool ? "" : " "; continue; }
          if (local >= 0.16) { out += ch; continue; }
          const step = Math.floor(local / 0.04);
          const r = mulberry32(seed * 977 + i * 31 + step)();
          if (pool) out += pool[Math.floor(r * pool.length)];
          else {
            const l = LETTERS[Math.floor(r * 26)];
            out += ch >= "A" && ch <= "Z" ? l.toUpperCase() : (ch >= "0" && ch <= "9" ? String(Math.floor(r * 10)) : l);
          }
        }
        return out;
      }

      // Title slot roll: each letter cycles seeded letters, then lands, one after another.
      const TITLE = "Six ciphers\nto play with";
      function title(t) {
        let html = "";
        let n = 0;
        for (let i = 0; i < TITLE.length; i++) {
          const ch = TITLE[i];
          if (ch === "\n" || ch === " ") { html += ch; continue; }
          const local = t - 0.35 - n * 0.025;
          n++;
          let g;
          if (local < 0) g = " ";
          else if (local >= 0.18) g = ch;
          else g = LETTERS[Math.floor(mulberry32(i * 131 + Math.floor(local / 0.045))() * 26)];
          if (i === 0 && g !== " ") g = g.toUpperCase();
          html += i < 3 ? '<span class="acc">' + g + "</span>" : g;
        }
        return html;
      }

      const outEl = document.getElementById("c-out");
      const keyEl = document.getElementById("c-key");
      const titleEl = document.getElementById("c-title");
      function render(t) {
        titleEl.innerHTML = title(t);
        let out = "Phhw dw 7";
        let key = "3";
        let muted = false;
        if (t >= 0.8) { out = ""; key = "This cipher has no key."; muted = true; }
        if (t >= 1.3) out = scramble("Zrrg ng 7", 1.3, t, 1);
        if (t >= 2.0) { out = ""; key = "LEMON"; muted = false; }
        if (t >= 2.45) out = scramble("Xiqh ne 7", 2.45, t, 2);
        if (t >= 3.35) { out = ""; key = "v1"; }
        if (t >= 3.7) out = scramble("🐖🐨🐨🐷 🐤🐷 🐇", 3.7, t, 3, ANIMALS);
        outEl.textContent = out;
        keyEl.textContent = key;
        keyEl.style.color = muted ? "#b4bfb8" : "#e4eae6";
      }
      const proxy = { t: 0 };
      tl.to(proxy, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(proxy.t) }, 0);

      // Lands out of Sam's zoom: big and soft, settling into place.
      tl.fromTo("#c-ui, #c-morph", { scale: 1.6, opacity: 0, filter: "blur(14px)", transformOrigin: "1064px 649px" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 0);
      tl.fromTo("#c-ground", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 0);
      tl.fromTo("#c-b1", { x: 0 }, { x: 120, duration: DUR, ease: "none" }, 0);

      tl.set("#c-ch0 .lab", { color: "#06281c" }, 0);
      function select(from, to, at) {
        tl.to("#c-ch" + from + " .on", { opacity: 0, duration: 0.12 }, at);
        tl.to("#c-ch" + from + " .lab", { color: "#e4eae6", duration: 0.12 }, at);
        tl.to("#c-ch" + to + " .on", { opacity: 1, duration: 0.12 }, at);
        tl.to("#c-ch" + to + " .lab", { color: "#06281c", duration: 0.12 }, at);

      function tap(sel, at) {

        tl.to("#c-finger", { scale: 1, duration: 0.12, ease: "power2.out" }, at + 0.1);
        if (sel) {
          tl.to(sel, { scale: 0.96, duration: 0.08, ease: "power2.in" }, at);
          tl.to(sel, { scale: 1, duration: 0.18, ease: "back.out(1.4)" }, at + 0.1);
