<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #111513;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: #111513;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
      <div id="ground"></div>
      <!-- Shot 1: Maya sends "Meet at 7" as a Caesar cipher (dark). -->
      <div id="maya" class="clip" data-composition-id="maya" data-composition-src="compositions/maya.html"
        data-start="0" data-duration="3.95" data-track-index="1" data-width="1920" data-height="1080" style="z-index:1"></div>
      <!-- Shot 2: Sam's phone (light): long-press, Decode…, key 3, the letters roll back. -->
      <div id="sam" class="clip" data-composition-id="sam" data-composition-src="compositions/sam.html"
        data-start="3.6" data-duration="8" data-track-index="2" data-width="1920" data-height="1080" style="z-index:2"></div>
      <!-- Shot 3: the Cipher tab cycles ROT13, Vigenère and Emoji code. -->
      <div id="cipher" class="clip" data-composition-id="cipher" data-composition-src="compositions/cipher.html"
        data-start="11.35" data-duration="4.85" data-track-index="3" data-width="1920" data-height="1080" style="z-index:3"></div>
      <!-- Shot 4: the output bubble becomes the Twin Bubbles mark. -->
      <div id="end" class="clip" data-composition-id="end" data-composition-src="compositions/end.html"
        data-start="16.2" data-duration="3.8" data-track-index="4" data-width="1920" data-height="1080" style="z-index:4"></div>

      <audio id="music" class="clip" src="assets/music.wav" data-start="0" data-duration="20" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
